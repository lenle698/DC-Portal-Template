    .loading{text-align:center;padding:60px 20px;color:#71717A;font-size:13px}.spinner{width:28px;height:28px;border:3px solid #E4E4E7;border-top-color:#F47920;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

<body>
  <main class="shell"><section class="stage" id="stage"><div class="loading"><div class="spinner"></div>Đang tải form bán hàng...</div></section></main>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  <script>
    const GEO={
      'TP. Hồ Chí Minh':{'Quận 1':['Bến Nghé','Bến Thành','Đa Kao','Nguyễn Thái Bình'],'Quận 3':['Võ Thị Sáu','Phường 1','Phường 4'],'Quận 7':['Tân Phú','Phú Mỹ','Tân Phong'],'Bình Thạnh':['Phường 12','Phường 25','Phường 26'],'Thủ Đức':['Linh Trung','Hiệp Bình Chánh','Trường Thọ']},
      'Hà Nội':{'Ba Đình':['Cống Vị','Ngọc Hà','Giảng Võ'],'Cầu Giấy':['Dịch Vọng','Mai Dịch','Trung Hòa'],'Đống Đa':['Khâm Thiên','Trung Liệt','Ô Chợ Dừa'],'Hoàng Mai':['Định Công','Đại Kim','Vĩnh Hưng']},
      'Đà Nẵng':{'Hải Châu':['Hòa Cường Bắc','Thanh Bình','Nam Dương'],'Thanh Khê':['An Khê','Xuân Hà','Chính Gián'],'Ngũ Hành Sơn':['Mỹ An','Khuê Mỹ','Hòa Hải']},
      'Bình Dương':{'Thủ Dầu Một':['Phú Cường','Chánh Nghĩa','Hiệp Thành'],'Dĩ An':['An Bình','Tân Đông Hiệp','Đông Hòa']},
      'Cần Thơ':{'Ninh Kiều':['An Hội','Tân An','Xuân Khánh'],'Bình Thủy':['An Thới','Bùi Hữu Nghĩa','Trà Nóc']},
      'Hải Phòng':{'Lê Chân':['An Biên','Cát Dài','Hồ Nam'],'Ngô Quyền':['Máy Tơ','Lạch Tray','Đông Khê']}
    };
    const SHIPS=[{id:'std',label:'Tiêu chuẩn',fee:25000},{id:'fast',label:'Nhanh',fee:45000},{id:'exp',label:'Hỏa tốc',fee:79000}];
    const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||''),stage=document.getElementById('stage'),modal=document.getElementById('modal'),previewMode=new URLSearchParams(location.search).get('preview')==='1';
    if(previewMode)document.documentElement.classList.add('preview-editor');
    const embedded=(()=>{try{return window.parent!==window;}catch(e){return true;}})();
    if(embedded)document.documentElement.classList.add('embedded');
    const API_ORIGIN=(location.protocol.startsWith('http')&&location.origin)?location.origin:'';
    const state={form:null,config:{},comboIndex:0,pay:'cod',ship:'std',step:1,province:'',district:'',ward:'',provinces:[],districts:[],wards:[],voucher:'',voucherApplied:'',voucherMessage:'',submitting:false,orderCode:'',selectedAddress:null,addressTimer:null,addressRequest:0,pixelEvent:'Purchase',pixelCheckoutTracked:false,pixelSuccessTracked:false};
    let parentTracking = {};
    function applyTrackingData(data) {
      if (!data || typeof data !== 'object') return;
      parentTracking = { ...parentTracking, ...data };
    }
    window.addEventListener('message', event => {
      if (!event.data) return;
      if (event.data.type === 'dc-sales-form:init-tracking') {
        applyTrackingData(event.data);
      }
    });
    if (embedded) {
      try { window.parent.postMessage({ type: 'dc-sales-form:request-tracking' }, '*'); } catch(e){}
    }
    let activePixelId='';
    const isPlainTemplate=()=>['plain','plain_compact'].includes(state.form?.template);
    const money=value=>new Intl.NumberFormat('vi-VN').format(Number(value)||0)+'₫';
    const safe=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const browserCookie=name=>{const prefix=`${name}=`;const part=String(document.cookie||'').split(';').map(value=>value.trim()).find(value=>value.startsWith(prefix));return part?decodeURIComponent(part.slice(prefix.length)):'';};
    function installMetaPixel(rawId){
      if(previewMode)return;
      const pixelId=String(rawId||'').trim();
      if(!/^\d{10,20}$/.test(pixelId)||activePixelId===pixelId)return;
      activePixelId=pixelId;
      if(parentTracking&&parentTracking.hasParentFb)return;
      if(!window.fbq){const fbq=window.fbq=function(){fbq.callMethod?fbq.callMethod.apply(fbq,arguments):fbq.queue.push(arguments)};if(!window._fbq)window._fbq=fbq;fbq.push=fbq;fbq.loaded=true;fbq.version='2.0';fbq.queue=[];const script=document.createElement('script');script.async=true;script.src='https://connect.facebook.net/en_US/fbevents.js';document.head.appendChild(script);}
      window.fbq('init',pixelId);
      window.fbq('trackSingle',pixelId,'PageView');
    }
    function trackMetaEvent(eventName,parameters={},options){if(previewMode||!activePixelId||typeof window.fbq!=='function')return;window.fbq('trackSingle',activePixelId,eventName,parameters,options||{});}
    function trackCheckoutStart(){
      if(state.pixelCheckoutTracked)return;
      state.pixelCheckoutTracked=true;
      if(embedded){

    async function findAddresses(query){const list=modal.querySelector('#address-suggestions'),hint=modal.querySelector('#address-hint');if(!list)return;const requestId=++state.addressRequest;if(query.length<3){list.classList.remove('open');list.innerHTML='';if(hint){hint.textContent='Nhập ít nhất 3 ký tự rồi chọn một địa chỉ được gợi ý.';hint.classList.remove('ok')}return}list.innerHTML='<div class="address-suggestion">Đang tìm địa chỉ...</div>';list.classList.add('open');try{const response=await fetch(`${API_ORIGIN}/api/public/address-suggestions?q=${encodeURIComponent(query)}`,{cache:'no-store'}),data=await response.json();if(requestId!==state.addressRequest)return;const items=Array.isArray(data.items)?data.items:[];list.innerHTML=items.length?items.map((item,index)=>`<button type="button" class="address-suggestion" data-address-index="${index}">${safe(item.label)}</button>`).join(''):'<div class="address-suggestion">Chưa tìm thấy. Bạn vẫn có thể nhập địa chỉ thủ công.</div>';list.classList.add('open');list.querySelectorAll('[data-address-index]').forEach(button=>button.addEventListener('click',()=>chooseAddress(items[Number(button.dataset.addressIndex)])))}catch(error){if(requestId!==state.addressRequest)return;list.innerHTML='<div class="address-suggestion">Không tải được gợi ý. Vui lòng nhập địa chỉ thủ công.</div>';list.classList.add('open')}}

    async function fetchLocations(type,code=''){const key=type==='districts'?'province':type==='wards'?'district':'';const url=`${API_ORIGIN}/api/public/locations?type=${encodeURIComponent(type)}${key?`&${key}=${encodeURIComponent(code)}`:''}`;const response=await fetch(url,{cache:'force-cache'}),data=await response.json();if(!response.ok)throw new Error(data.error||'Không tải được địa giới');return Array.isArray(data.items)?data.items:[]}

    function validateVnPhone(raw){
      let digits=String(raw||'').replace(/\D/g,'');
      if(digits.startsWith('84')&&digits.length>=11)digits='0'+digits.slice(2);
      else if(!digits.startsWith('0')&&digits.length===9&&/^[35789]/.test(digits))digits='0'+digits;
      const isVnMobile=/^0(3[2-9]|5[25689]|7[06-9]|8[1-9]|9\d)\d{7}$/.test(digits)||/^0[35789]\d{8}$/.test(digits);
      if(digits.length!==10||!isVnMobile){
        return{valid:false,phone:digits,error:'Số điện thoại không đúng chuẩn di động Việt Nam (yêu cầu đủ 10 số, bắt đầu bằng 03, 05, 07, 08, 09).'};
      }
      if(/^0?(\d)\1{8,9}$/.test(digits)||digits==='0123456789'||digits==='0987654321'){
        return{valid:false,phone:digits,error:'Số điện thoại không hợp lệ (vui lòng nhập số điện thoại thật).'};
      }
      return{valid:true,phone:digits};
    }
    function toCheckout(event){event.preventDefault();trackCheckoutStart();const form=event.currentTarget,error=modal.querySelector('#form-error');if(!form.reportValidity())return;const phoneCheck=validateVnPhone(form.phone.value);if(!phoneCheck.valid){error.textContent=phoneCheck.error;error.classList.add('show');form.phone.focus();return}form.phone.value=phoneCheck.phone;state.values=Object.fromEntries(new FormData(form).entries());state.values.phone=phoneCheck.phone;state.province=form.elements.province?.value||state.province;state.district=form.elements.district?.value||state.district;state.ward=form.elements.ward?.value||state.ward;if(isPlainTemplate()){submitLead();return}state.step=2;renderModal();fillReview();notifyEmbedHeight()}
    async function submitLead(){
      if(state.submitting)return;
      const button=state.step===1?modal.querySelector('#lead-form .primary'):modal.querySelector('#confirm-order'),error=modal.querySelector(state.step===1?'#form-error':'#submit-error'),values=state.values||{};

      const utm_source = getT('utm_source');

      const utm_campaign = getT('utm_campaign');
      const utm_content = getT('utm_content');
      const utm_term = getT('utm_term');

      const campaign_id = getT('campaign_id') || getT('campaignId') || getT('camp_id') || getT('campaignid') || getT('tt_campaign_id');
      const adset_id = getT('adset_id') || getT('adsetId') || getT('ad_set_id') || getT('adgroup_id') || getT('adgroupid') || getT('tt_adgroup_id');
      const ad_id = getT('ad_id') || getT('adId') || getT('adid') || getT('creative') || getT('tt_ad_id');
      const campaign_name = getT('campaign_name') || getT('campaignName') || utm_campaign;

      const addrRaw=state.selectedAddress?.label||[values.street||values.addressSearch,state.ward,state.district,state.province].filter(Boolean).join(', ')||values.addressSearch||values.street||'';

                timestamp:Date.now()

            }catch(e){}

          if(!state.pixelSuccessTracked){
            state.pixelSuccessTracked=true;
            if(!parentTracking.hasParentFb&&activePixelId){
              trackMetaEvent(state.pixelEvent,{content_name:productName(),content_ids:[state.form?.productId||state.form?.slug||slug],content_type:'product',value:Number(data.value)||grandTotal(),currency:data.currency||'VND',num_items:qty()},{eventID:state.orderCode||undefined});
            }
          }
        }
        state.step=4;renderModal();
        const done=modal.querySelector('#done-copy');
        if(done)done.textContent=(data.message||'Đội ngũ sẽ liên hệ xác nhận sớm.')+(state.orderCode?' Mã đơn: '+state.orderCode+'.':'');
        notifyEmbedHeight();
      }catch(reason){
        if(error){error.textContent=reason.message;error.classList.add('show');}
      }finally{
        state.submitting=false;
        if(button){button.disabled=false;button.textContent='Xác nhận đặt hàng COD';}

    }

    let touchY=0,touchDialog=null;
