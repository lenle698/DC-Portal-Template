<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <link rel="icon" type="image/jpeg" href="/assets/dc-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#20273A;background:#F5F7FB;overflow:hidden}.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1}.topbar{height:68px;background:#fff;border-bottom:1px solid #E5E9F1;display:flex;align-items:center;gap:15px;padding:0 22px;position:relative;z-index:3}.back{display:flex;align-items:center;gap:6px;color:#5B6780;text-decoration:none;font-size:13px;font-weight:700}.separator{width:1px;height:27px;background:#E5E9F1}.heading{min-width:220px;flex:1}.heading h1{margin:0;color:#13225E;font-size:17px}.heading p{margin:3px 0 0;color:#8490A6;font-size:11.5px}.toolbar{display:flex;align-items:center;gap:8px}.tool-group{display:flex;align-items:center;gap:3px;padding:3px;border:1px solid #E1E6F0;border-radius:10px;background:#F7F9FC}.tool-group button,.reset,.sync{height:32px;border:0;background:transparent;border-radius:7px;font:700 13px inherit;color:#1B2A62;cursor:pointer}.tool-group button{width:32px;font-size:20px}.zoom-label{width:45px;text-align:center;font-size:11.5px;font-weight:800;color:#4F5D78}.reset,.sync{display:inline-flex;align-items:center;gap:6px;padding:0 11px;border:1px solid #E1E6F0;background:#fff}.sync{background:#FFF2E7;border-color:#FFD7BA;color:#C95C10}.canvas{height:calc(100vh - 68px);overflow:hidden;position:relative;cursor:grab;background-image:radial-gradient(#DCE3EF 1px,transparent 1px);background-size:24px 24px}.canvas.is-dragging{cursor:grabbing}.stage{width:max-content;min-width:100%;padding:54px 70px 100px;transform-origin:0 0;transition:transform .12s ease}.org-root{margin:0 auto 0;width:290px;padding:14px 17px;border-radius:13px;color:#fff;background:#12205F;box-shadow:0 10px 25px rgba(18,32,95,.2);display:flex;align-items:center;gap:12px}.root-logo{width:39px;height:39px;border-radius:9px;background:#F47920;display:grid;place-items:center;font-size:14px;font-weight:800}.org-root strong{font-size:14px}.org-root span{display:block;margin-top:3px;color:#B9C5EF;font-size:11.5px}.trunk{width:2px;height:28px;margin:0 auto;background:#C9D2E2}.bus{height:2px;margin:0 auto;background:#C9D2E2}.branches{display:flex;gap:42px;align-items:flex-start;justify-content:center}.branch{width:278px;display:flex;flex-direction:column;align-items:center}.branch-line{width:2px;height:25px;background:#C9D2E2}.branch-head{width:100%;min-height:69px;border-radius:12px;background:#1B2440;padding:11px 13px;display:flex;align-items:center;gap:10px;box-shadow:0 7px 17px rgba(18,32,95,.15)}.avatar{width:34px;height:34px;border-radius:9px;background:#2E43A8;display:grid;place-items:center;flex:0 0 34px;overflow:hidden;color:#fff;font-size:11px;font-weight:800}.avatar img,.member-avatar img{width:100%;height:100%;object-fit:cover}.branch-head .copy{min-width:0;border-left:2px solid rgba(255,255,255,.2);padding-left:10px}.branch-head strong{display:block;color:#fff;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.branch-head span{display:block;margin-top:3px;color:#B4C0E6;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.members{width:100%;margin-top:24px;position:relative;display:flex;flex-direction:column;gap:11px;padding-left:14px}.members:before{content:'';position:absolute;left:1px;top:-24px;bottom:25px;width:2px;background:#C9D2E2}.member-row{position:relative;display:flex;align-items:center}.member-row:before{content:'';position:absolute;left:-13px;top:50%;width:13px;height:2px;background:#C9D2E2}.member{width:100%;min-height:55px;background:#fff;border:1px solid #E0E5EF;border-radius:11px;padding:8px 10px;display:flex;align-items:center;gap:9px;box-shadow:0 2px 5px rgba(18,32,95,.05)}.member-avatar{width:29px;height:29px;border-radius:8px;background:#EFF3FF;color:#294199;display:grid;place-items:center;overflow:hidden;flex:0 0 29px;font-size:9px;font-weight:800}.member-copy{min-width:0;border-left:2px solid #EDF0F5;padding-left:9px}.member-copy strong{display:block;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.member-copy span{display:block;margin-top:2px;color:#909AAF;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.child-dept{margin:3px 0 3px 14px;padding:10px;border:1px dashed #C9D5EF;border-radius:10px;background:#F8FAFF;color:#526282}.child-dept-head{font-size:10.5px;font-weight:800}.child-dept-head small{display:block;margin-top:3px;font-size:10px;font-weight:600;color:#8895AD}.child-members{display:flex;flex-direction:column;gap:7px;margin-top:8px}.child-dept .member-row:before{background:#D7E0F2}.child-dept .member{background:#fff}.hint{position:absolute;left:20px;bottom:17px;background:rgba(255,255,255,.9);border:1px solid #E2E7F0;border-radius:9px;padding:7px 12px;color:#78849A;font-size:11px}.empty{margin:60px auto;padding:22px 28px;border:1px dashed #C6D2ED;border-radius:14px;background:#fff;color:#67738B;font-size:13px;text-align:center}@media(max-width:700px){.topbar{height:auto;min-height:64px;padding:10px 12px;flex-wrap:wrap}.separator{display:none}.back{display:flex;width:38px;height:38px;flex:0 0 38px;justify-content:center;border:1px solid #E1E6F0;border-radius:10px;background:#F7F9FC;color:#13225E}.back-label{display:none}.heading{min-width:0}.toolbar{width:100%;justify-content:space-between}.canvas{height:calc(100vh - 112px)}.stage{padding:35px 35px 80px}.hint{display:none}}
    .stage{padding:38px 60px 90px}.org-root{width:max-content;min-width:360px;max-width:720px;padding:10px 13px;border:2px solid #F47920;border-radius:12px;display:block}.root-board-title{display:block;text-align:center;color:#B9C5EF!important;font-size:10px!important;font-weight:800;letter-spacing:.6px;text-transform:uppercase}.root-members{display:flex;align-items:center;justify-content:center;margin-top:7px}.root-person{display:flex;align-items:center;gap:9px;min-width:0;padding:0 13px}.root-person+.root-person{border-left:1px solid rgba(255,255,255,.18)}.root-person .root-logo{flex:0 0 36px}.root-person-copy{min-width:0}.root-person-copy strong{display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.root-person-copy span{display:block;margin-top:2px}.root-logo{width:36px;height:36px;border-radius:8px;font-size:12px;overflow:hidden}.root-logo img{width:100%;height:100%;object-fit:cover}.org-root strong{font-size:13px}.org-root span{font-size:10.5px}.trunk{height:26px}.branches{gap:40px}.branch{width:264px}.branch-line{height:24px}.branch-head{min-height:57px;padding:10px 13px;border-radius:11px}.avatar{width:32px;height:32px;flex-basis:32px;border-radius:8px}.members{margin-top:20px;gap:10px;padding-left:13px}.members:before{top:-20px}.member{min-height:48px;padding:7px 10px;border-radius:10px}.member-avatar{width:28px;height:28px;flex-basis:28px}.member-copy strong{font-size:11.5px}.member-copy span{font-size:9.5px}body.embed .topbar,body.embed .hint{display:none}body.embed .canvas{height:100vh}
    .org-root{min-width:520px}.root-person{min-width:235px}.root-person-copy strong{max-width:205px;font-size:11.5px;line-height:1.28;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}.branch-head{min-height:62px}.branch-head strong{font-size:11px;line-height:1.25;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}.branch-head span{font-size:9.5px}.member{min-height:58px}.member-copy{flex:1}.member-copy strong{font-size:10.5px;line-height:1.28;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}.member-copy span{font-size:9px}
    @keyframes orgShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}@keyframes orgLoadIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.org-loading{min-width:1280px;animation:orgLoadIn .25s ease}.org-loading-root{width:420px;height:72px;margin:0 auto;border-radius:13px}.org-loading-trunk{width:2px;height:28px;margin:0 auto;background:#D7DEEA}.org-loading-bus{height:2px;width:1216px;margin:0 auto;background:#D7DEEA}.org-loading-branches{display:grid;grid-template-columns:repeat(5,224px);gap:24px;justify-content:center}.org-loading-branch{padding-top:24px;position:relative}.org-loading-branch:before{content:'';position:absolute;left:50%;top:0;width:2px;height:24px;background:#D7DEEA}.org-loading-head{height:58px;border-radius:11px}.org-loading-row{height:50px;margin-top:10px;border-radius:10px}.org-loading-root,.org-loading-head,.org-loading-row{background:linear-gradient(90deg,#E4E8F0 25%,#F8F9FC 50%,#E4E8F0 75%);background-size:200% 100%;animation:orgShimmer 1.35s linear infinite}.org-loading-branch:nth-child(2) .org-loading-head,.org-loading-branch:nth-child(2) .org-loading-row{animation-delay:.08s}.org-loading-branch:nth-child(3) .org-loading-head,.org-loading-branch:nth-child(3) .org-loading-row{animation-delay:.16s}.org-loading-branch:nth-child(4) .org-loading-head,.org-loading-branch:nth-child(4) .org-loading-row{animation-delay:.24s}.org-loading-branch:nth-child(5) .org-loading-head,.org-loading-branch:nth-child(5) .org-loading-row{animation-delay:.32s}
  </style>
</head>
<body>
  <header class="topbar"><a class="back" href="/portal?section=hr" aria-label="Quay lại Nhân sự"><span class="ms">arrow_back</span><span class="back-label">Nhân sự</span></a><span class="separator"></span><div class="heading"><h1>Sơ đồ tổ chức</h1><p id="summary">Đang đồng bộ dữ liệu Lark…</p></div><div class="toolbar"><div class="tool-group"><button id="zoom-out" title="Thu nhỏ">−</button><span class="zoom-label" id="zoom-label">92%</span><button id="zoom-in" title="Phóng to">+</button></div><button class="reset" id="reset"><span class="ms">center_focus_strong</span>Căn giữa</button></div></header>
  <main class="canvas" id="canvas"><div class="stage" id="stage"><div id="chart"><div class="org-loading"><div class="org-loading-root"></div><div class="org-loading-trunk"></div><div class="org-loading-bus"></div><div class="org-loading-branches"><div class="org-loading-branch"><div class="org-loading-head"></div><div class="org-loading-row"></div></div><div class="org-loading-branch"><div class="org-loading-head"></div><div class="org-loading-row"></div><div class="org-loading-row"></div></div><div class="org-loading-branch"><div class="org-loading-head"></div><div class="org-loading-row"></div></div><div class="org-loading-branch"><div class="org-loading-head"></div><div class="org-loading-row"></div></div><div class="org-loading-branch"><div class="org-loading-head"></div></div></div></div></div></div><div class="hint">Kéo để di chuyển · Ctrl + lăn để thu/phóng</div></main>
  <script>
    const state={zoom:.92,x:0,y:0}; const canvas=document.querySelector('#canvas'),stage=document.querySelector('#stage'),chart=document.querySelector('#chart');
    const params=new URLSearchParams(location.search),english=(params.get('lang')||localStorage.getItem('dc_portal_lang'))==='en';
    const t=(vi,en)=>english?en:vi;
    if(params.get('embed')==='1')document.body.classList.add('embed');
    document.querySelector('.back').href=`/portal?section=hr`;
    document.querySelector('.back-label').textContent=t('Nhân sự','People');
    document.querySelector('.back').setAttribute('aria-label',t('Quay lại Nhân sự','Back to People'));
    document.querySelector('.heading h1').textContent=t('Sơ đồ tổ chức','Organization chart');
    document.querySelector('#summary').textContent=t('Đang đồng bộ dữ liệu Lark…','Syncing Lark data…');
    document.querySelector('#zoom-out').title=t('Thu nhỏ','Zoom out');document.querySelector('#zoom-in').title=t('Phóng to','Zoom in');
    document.querySelector('#reset').lastChild.nodeValue=t('Căn giữa','Center');
    document.querySelector('.hint').textContent=t('Kéo để di chuyển · Ctrl + lăn để thu/phóng','Drag to move · Ctrl + scroll to zoom');
    const initials=name=>String(name||'LK').trim().split(/\s+/).filter(Boolean).slice(-2).map(x=>x[0]).join('').toUpperCase()||'LK';
    const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function avatar(member,cls='avatar'){return `<div class="${cls}">${member.avatarUrl?`<img src="${esc(member.avatarUrl)}" alt="">`:initials(member.name)}</div>`}
    function renderTransform(){stage.style.transform=`translate(${state.x}px,${state.y}px) scale(${state.zoom})`;document.querySelector('#zoom-label').textContent=Math.round(state.zoom*100)+'%'}
    function fitView(){requestAnimationFrame(()=>{const available=Math.max(260,canvas.clientWidth-28);const natural=Math.max(1,stage.scrollWidth);state.zoom=Math.max(.32,Math.min(.92,available/natural));state.x=Math.max(0,(canvas.clientWidth-natural*state.zoom)/2);state.y=0;renderTransform()})}
    function memberCard(member){return `<div class="member-row"><div class="member">${avatar(member,'member-avatar')}<div class="member-copy"><strong>${esc(member.name)}</strong><span>${esc(member.employeeNo||t('Nhân sự Lark','Lark employee'))}</span></div></div></div>`}
    function buildTree(data){const departments=data.departments||[],members=data.members||[],byId=new Map(departments.map(d=>[d.id,d]));const children=new Map();departments.forEach(d=>{const parent=byId.has(d.parentId)?d.parentId:null;const list=children.get(parent)||[];list.push(d);children.set(parent,list)});const roots=children.get(null)||departments;const rootDept=roots.find(d=>/^bod$/i.test(d.name))||roots[0];const rootMembers=rootDept?members.filter(m=>m.departmentId===rootDept.id):[];const rootPeople=rootMembers.length?rootMembers:[{name:'DC Vietnam',avatarUrl:'',employeeNo:''}];const rootPeopleHtml=rootPeople.map(person=>`<div class="root-person"><div class="root-logo">${person.avatarUrl?`<img src="${esc(person.avatarUrl)}" alt="">`:initials(person.name)}</div><div class="root-person-copy"><strong>${esc(person.name)}</strong><span>${esc(person.employeeNo||t('Thành viên BOD','BOD member'))}</span></div></div>`).join('');const branchDepartments=[...(rootDept?(children.get(rootDept.id)||[]):[]),...roots.filter(d=>d!==rootDept)];const branchHtml=branchDepartments.map(d=>{const direct=members.filter(m=>m.departmentId===d.id);const leader=direct.find(m=>m.isDepartmentLead);const visibleMembers=leader?direct.filter(m=>m.id!==leader.id):direct;const head=leader||{name:d.name,avatarUrl:''};return `<section class="branch"><div class="branch-line"></div><div class="branch-head">${avatar(head)}<div class="copy"><strong>${esc(head.name)}</strong><span>${leader?`${t('Trưởng phòng','Head of')} ${esc(d.name)}`:t('Chưa đồng bộ Group Owner','Group Owner not synced')}</span></div></div><div class="members">${visibleMembers.map(memberCard).join('')}</div></section>`}).join('');const width=Math.max(0,(branchDepartments.length-1)*(264+40));chart.innerHTML=branchDepartments.length?`<div class="org-root"><span class="root-board-title">${esc(rootDept?.name||'BOD')}</span><div class="root-members">${rootPeopleHtml}</div></div><div class="trunk"></div><div class="bus" style="width:${width}px"></div><div class="branches">${branchHtml}</div>`:`<div class="empty">${t('Chưa có phòng ban trong phạm vi Lark Contacts.','No departments are available within the Lark Contacts scope.')}</div>`;document.querySelector('#summary').textContent=english?`DC Vietnam · ${members.length} employees · ${departments.length} departments${data.stale?' · latest saved data':''}`:`DC Vietnam · ${members.length} nhân sự · ${departments.length} phòng ban${data.stale?' · dữ liệu gần nhất':''}`;fitView()}
    async function sync(){try{const res=await fetch('/api/organization',{credentials:'same-origin'});if(!res.ok)throw new Error();buildTree(await res.json())}catch{chart.innerHTML=`<div class="empty">${t('Không thể đồng bộ Lark Contacts. Vui lòng thử lại.','Unable to sync Lark Contacts. Please try again.')}</div>`}}
    document.querySelector('#zoom-in').onclick=()=>{state.zoom=Math.min(1.7,state.zoom+.12);renderTransform()};document.querySelector('#zoom-out').onclick=()=>{state.zoom=Math.max(.45,state.zoom-.12);renderTransform()};document.querySelector('#reset').onclick=fitView;
    let drag=null;canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,ox:state.x,oy:state.y};canvas.classList.add('is-dragging')});window.addEventListener('mousemove',e=>{if(!drag)return;state.x=drag.ox+e.clientX-drag.x;state.y=drag.oy+e.clientY-drag.y;renderTransform()});window.addEventListener('mouseup',()=>{drag=null;canvas.classList.remove('is-dragging')});canvas.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();state.zoom=Math.max(.45,Math.min(1.7,state.zoom-e.deltaY*.002));renderTransform()}},{passive:false});window.addEventListener('resize',fitView);renderTransform();sync();
  </script>
</body>
</html>
